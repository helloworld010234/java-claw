spring:
  application:
    name: java-claw

tiny-claw:
  model:
    enabled: false
    provider: spring-ai
    # Target model: deepseek-v4-flash
    name: deepseek-v4-flash
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    temperature: 0.7
    max-tokens: 4096
    pricing:
      input-price-per-1m: 0.0
      output-price-per-1m: 0.0
    # Reliability settings
    request-timeout-seconds: 60
    max-retry-attempts: 3
    retry-backoff-ms: 1000
    usage-cost-summary-enabled: true
  agent:
    max-turns: 20
    max-tool-calls-per-turn: 8
    max-runtime-seconds: 600
  tool:
    shell-timeout-seconds: 30
    max-output-chars: 8000
  approval:
    enabled: true
    timeout-seconds: 600
