spring:
  application:
    name: java-claw

tiny-claw:
  model:
    enabled: false
    provider: spring-ai
    # Target model: deepseek-v4-flash
    name: deepseek-v4-flash
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    temperature: 0.7
    max-tokens: 4096
    pricing:
      input-price-per-1m: 0.0
      output-price-per-1m: 0.0
    # Reliability settings
    request-timeout-seconds: 60
    max-retry-attempts: 3
    retry-backoff-ms: 1000
    usage-cost-summary-enabled: true
  agent:
    max-turns: 20
    max-tool-calls-per-turn: 8
    max-runtime-seconds: 600
    plan-mode: false        # 是否启用 Plan Mode 规范
  security:
    enabled: true           # 是否启用 API Key 认证
    api-key:
      user-key: ${TINyclaw_API_KEY:}   # 普通操作 Key
      admin-key: ${TINyclaw_ADMIN_KEY:} # 审批操作需要 Admin Key
  tool:
    shell-timeout-seconds: 30
    max-output-chars: 8000
  workspace:
    root: ${user.dir}
  approval:
    enabled: true
    timeout-seconds: 600
    required-tools:
      - write_file
      - edit_file
      - shell_command
