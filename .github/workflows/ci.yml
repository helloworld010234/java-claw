name: CI / P3 Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  maven-verify:
    name: Maven Verify + Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven verify
        run: mvn -B -q clean verify
        env:
          # CI must never use real LLM / Feishu keys; tests use FakeLlmGateway / H2.
          LLM_API_KEY: ci-dummy-key
          LLM_BASE_URL: http://127.0.0.1:1

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  p1-smoke:
    name: P1 E2E Smoke (Windows)
    needs: maven-verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: P1 smoke
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\smoke\p1-e2e-smoke.ps1
        env:
          # Smoke uses its own stub and dummy keys; no outbound Feishu call is made.
          LLM_API_KEY: ci-dummy-key
          LLM_BASE_URL: http://127.0.0.1:1

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            .smoke/logs/
            notes/session-logs/
          if-no-files-found: ignore
